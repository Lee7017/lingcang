name: Sync iOS support statistics

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 和官网现有 Pages 部署串行，防止同时部署互相覆盖。
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and sanitize sponsorship statistics
        id: data
        env:
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_API_TOKEN: ${{ secrets.AFDIAN_API_TOKEN }}
          AFDIAN_PLAN_ID: ${{ secrets.AFDIAN_PLAN_ID }}
          AFDIAN_SUPPORT_URL: ${{ vars.AFDIAN_SUPPORT_URL }}
        shell: bash
        run: |
          node scripts/sync-ios-support.mjs
          if git diff --quiet -- docs/public/support/ios.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.data.outputs.changed == 'true'
        run: npm install --no-audit --no-fund
      - name: Build website with fresh statistics
        if: steps.data.outputs.changed == 'true'
        env:
          SITE_BASE: ${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build:with-demo
      - name: Configure Pages
        if: steps.data.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.data.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - name: Deploy Pages
        if: steps.data.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
