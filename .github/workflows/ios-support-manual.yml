name: Manual iOS support sync

# 只由仓库管理员在 Actions 页面点击 Run workflow 时查询爱发电。
# 更新 support/ios.json 不会触发官网 Pages 构建。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-support-manual
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify API credentials and read-only order query
        env:
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_API_TOKEN: ${{ secrets.AFDIAN_API_TOKEN }}
          AFDIAN_PLAN_ID: ${{ secrets.AFDIAN_PLAN_ID || 'd9aa8642e2b411f181af52540025c377' }}
        run: node scripts/verify-afdian.mjs
      - name: Query Afdian and build public-only statistics
        env:
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_API_TOKEN: ${{ secrets.AFDIAN_API_TOKEN }}
          AFDIAN_PLAN_ID: ${{ secrets.AFDIAN_PLAN_ID || 'd9aa8642e2b411f181af52540025c377' }}
          AFDIAN_SUPPORT_URL: ${{ vars.AFDIAN_SUPPORT_URL || 'https://afdian.com/item/d9aa8642e2b411f181af52540025c377' }}
        run: node scripts/sync-ios-support.mjs
      - name: Commit only updated public support JSON
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- support/ios.json; then
            echo "No changes to public statistics"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- support/ios.json
          git commit -m "Update public iOS support statistics (manual)"
          git push origin HEAD:main
